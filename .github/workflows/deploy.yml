name: deploy
on:
  push:
    branches: [main]
jobs:
  test:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pytest
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploying with ${{ secrets.DEPLOY_TOKEN }}"
      - run: ./deploy.sh
